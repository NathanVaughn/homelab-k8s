repos:
  - repo: https://pkgs.nathanv.app/git/github/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
  - repo: https://pkgs.nathanv.app/git/github/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - args:
          - --fix
        id: ruff-check
      - id: ruff-format
  - repo: https://pkgs.nathanv.app/git/github/astral-sh/ty-pre-commit
    rev: v0.0.100
    hooks:
      - id: ty
  - repo: https://pkgs.nathanv.app/git/github/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
  - repo: https://pkgs.nathanv.app/git/github/tarioch/flux-check-hook
    rev: v0.9.0
    hooks:
      - id: check-flux-helm-values
  - repo: https://pkgs.nathanv.app/git/github/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # exclude flux which is auto-generated
        exclude: ^cluster/flux-system
  - repo: local
    hooks:
      - id: cloudflared-config
        name: Cloudflared Config
        entry: uv run cluster/cloudflared/create-config.py
        language: system
        pass_filenames: false
        always_run: true
      - id: git-pkgs-config
        name: Git Pkgs Config
        entry: uv run cluster/git-pkgs/create-config.py
        language: system
        pass_filenames: false
        always_run: true
