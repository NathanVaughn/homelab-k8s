[project]
    name            = "homelab-k8s"
    version         = "0.1.0"
    description     = "My homelab using Kubernetes and cofiguration as code"
    readme          = "README.md"
    requires-python = ">=3.13"
    dependencies    = ["pyinfra>=3.1.1", "fabric>=3.2.2", "pyyaml>=6.0.2"]

[dependency-groups]
    dev = ["prek>=0.4.5"]

[tool.ruff.lint]
    extend-select = ["ANN"]            # type annotations
    ignore        = ["ANN401", "E501"]

[[tool.uv.index]]
    name    = "mypypi"
    url     = "https://pypi.nathanv.app/pypi/simple"
    default = true
