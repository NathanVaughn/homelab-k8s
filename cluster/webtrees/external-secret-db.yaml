apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webtrees-db-env
  namespace: webtrees
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: webtrees-db-env
  data:
    - secretKey: MARIADB_PASSWORD
      remoteRef:
        key: WEBTREES_DB_PASSWORD
    - secretKey: MARIADB_USER
      remoteRef:
        key: WEBTREES_DB_USERNAME
    - secretKey: MARIADB_DATABASE
      remoteRef:
        key: WEBTREES_DB_DATABASE
