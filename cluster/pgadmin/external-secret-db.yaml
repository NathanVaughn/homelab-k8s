apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-db-env
  namespace: pgadmin
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: pgadmin-db-env
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: PGADMIN_DB_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: PGADMIN_DB_USERNAME
    - secretKey: POSTGRES_DB
      remoteRef:
        key: PGADMIN_DB_DATABASE
