apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freshrss-network-policy
  namespace: freshrss
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # pgadmin to PostgreSQL
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pgadmin
      ports:
        - protocol: TCP
          port: 5432
    # Intra-namespace (freshrss <-> its own postgresql)
    - from:
        - podSelector: {}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # External (RSS feed fetching)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
