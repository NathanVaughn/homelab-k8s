apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediacms-db-env-external
  namespace: mediacms
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mediacms-db-env
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: MEDIACMS_DB_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: MEDIACMS_DB_USERNAME
    - secretKey: POSTGRES_DB
      remoteRef:
        key: MEDIACMS_DB_DATABASE
