apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstack-network-policy
  namespace: bookstack
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # Intra-namespace
    - from:
        - podSelector: {}
    # phpMyAdmin to MySQL
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: phpmyadmin
      ports:
        - protocol: TCP
          port: 3306
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # Internal HTTPS via Traefik (Service port 443 -> pod port 8443)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8443
    # External (OIDC, SMTP)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
