apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstack-app-env-external
  namespace: bookstack
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: bookstack-app-env
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: BOOKSTACK_APP_KEY
    - secretKey: DB_DATABASE
      remoteRef:
        key: BOOKSTACK_DB_DATABASE
    - secretKey: DB_USERNAME
      remoteRef:
        key: BOOKSTACK_DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: BOOKSTACK_DB_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: BOOKSTACK_OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: BOOKSTACK_OIDC_CLIENT_SECRET
    - secretKey: MAIL_HOST
      remoteRef:
        key: BOOKSTACK_SMTP_HOST
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: BOOKSTACK_SMTP_USERNAME
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: BOOKSTACK_SMTP_PASSWORD
