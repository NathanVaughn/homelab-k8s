apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-network-policy
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External clients via the LoadBalancer VIP
    # NOTE: NetworkPolicy ports match the pod's actual containerPort (post-Service-DNAT),
    # not the Service's port, so these must be the "web"/"websecure" container ports.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
    # Prometheus scraping traefik metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 9100
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # Traefik is the reverse proxy for every app namespace, so it must be able to
    # reach any backend service. The actual restriction happens on the ingress
    # side of each backend namespace's NetworkPolicy (only allowing traefik on
    # its specific service port), so this broad allow is safe.
    - to:
        - namespaceSelector: {}
    # External (ACME/Let's Encrypt, Cloudflare DNS challenge API)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
