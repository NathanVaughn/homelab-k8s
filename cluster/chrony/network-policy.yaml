apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chrony-network-policy
  namespace: chrony
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # NTP queries from the local network (LoadBalancer service, not behind traefik)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: UDP
          port: 123
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # External (upstream NTP server + NTS key exchange)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 123
        - protocol: TCP
          port: 4460
