apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor-release
  namespace: harbor
spec:
  releaseName: harbor
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor-repo
        namespace: harbor
      version: "1.19.4"
  interval: 1h0m0s
  # Apply AppArmor profile to the database StatefulSet
  # Default containerd AppArmor profile breaks postgres signalling on kernel 7.0.0-42
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              labelSelector: app.kubernetes.io/component=database
            patch: |
              - op: add
                path: /spec/template/spec/securityContext/appArmorProfile
                value:
                  type: Unconfined
  values:
    externalURL: https://cr.nathanv.app
    updateStrategy:
      type: Recreate
    expose:
      type: clusterIP
      tls:
        enabled: false
    nginx:
      nodeSelector:
        role: apps
    portal:
      nodeSelector:
        role: apps
    core:
      nodeSelector:
        role: apps
    jobservice:
      nodeSelector:
        role: apps
    registry:
      # needed for reverse proxy
      relativeurls: true
      nodeSelector:
        role: apps
    trivy:
      nodeSelector:
        role: apps
    database:
      internal:
        nodeSelector:
          role: apps
    redis:
      internal:
        nodeSelector:
          role: apps
    exporter:
      nodeSelector:
        role: apps
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    persistence:
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          accessMode: ReadWriteOnce
          size: 35Gi
        jobservice:
          jobLog:
            storageClass: longhorn
            accessMode: ReadWriteOnce
        database:
          storageClass: longhorn
          accessMode: ReadWriteOnce
        redis:
          storageClass: longhorn
          accessMode: ReadWriteOnce
        trivy:
          storageClass: longhorn
          accessMode: ReadWriteOnce
  valuesFrom:
    - kind: Secret
      name: harbor-secrets
      valuesKey: harborAdminPassword
      targetPath: harborAdminPassword
    - kind: Secret
      name: harbor-secrets
      valuesKey: registry.credentials.password
      targetPath: registry.credentials.password
    - kind: Secret
      name: harbor-secrets
      valuesKey: database.internal.password
      targetPath: database.internal.password
