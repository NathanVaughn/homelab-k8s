apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webtrees-test-app-env
  namespace: webtrees-test
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: webtrees-test-app-env
  data:
    - secretKey: DB_PASS
      remoteRef:
        key: WEBTREES_TEST_DB_PASSWORD
    - secretKey: DB_USER
      remoteRef:
        key: WEBTREES_TEST_DB_USERNAME
    - secretKey: DB_NAME
      remoteRef:
        key: WEBTREES_TEST_DB_DATABASE
