apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: technitium-dns-network-policy
  namespace: technitium-dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # Intra-namespace
    - from:
        - podSelector: {}
    # k8s-dns needs to reach technitium API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-dns
      ports:
        - protocol: TCP
          port: 5380
    # pgadmin to PostgreSQL
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pgadmin
      ports:
        - protocol: TCP
          port: 5432
    # DNS queries from the cluster and network
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  egress:
    # DNS (upstream resolvers)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # External (upstream DNS resolution, DoH, DoT)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 853
