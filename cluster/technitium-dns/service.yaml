apiVersion: v1
kind: Service
metadata:
  name: technitium-dns-service
  namespace: technitium-dns
  annotations:
    kube-vip.io/loadbalancerIPs: "10.10.10.10"
spec:
  type: LoadBalancer
  selector:
    app: technitium-dns
  ports:
    - port: 5380
      protocol: TCP
      name: web
    - port: 53
      protocol: TCP
      name: dns-tcp
    - port: 53
      protocol: UDP
      name: dns-udp
