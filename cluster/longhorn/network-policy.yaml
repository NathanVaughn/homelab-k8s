apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-network-policy
  namespace: longhorn
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress (web UI, longhorn-ui container port, post-Service-DNAT)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # Intra-namespace (manager <-> instance-manager <-> csi plugins <-> ui)
    - from:
        - podSelector: {}
    # RWX volume mounts: kubelet on each node mounts share-manager NFS exports
    # (port 2049) via the host's network namespace (nsmounter), not from a pod,
    # so podSelector alone doesn't match this traffic - needs node/private
    # network ipBlock like the egress rule below.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 2049
        - protocol: TCP
          port: 111
        - protocol: UDP
          port: 111
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # Kubernetes API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # External backup target (S3-compatible, e.g. Backblaze B2) for
    # recurring system-backup/volume-backup jobs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Longhorn engines/replicas and NFS backups communicate directly between
    # nodes (iSCSI, gRPC, NFS) outside of normal service ports, so node/private
    # network access is left broadly open here rather than pinned to specific
    # ports to avoid risking storage availability.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
