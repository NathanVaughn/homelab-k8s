apiVersion: networking.k8s.io/v1
# https://github.com/longhorn/longhorn/blob/master/examples/network-policy/allow-prometheus-to-longhorn-manager.yaml
# https://longhorn.io/docs/1.12.1/monitoring/prometheus-and-grafana-setup/
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-longhorn-manager
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Keep both selectors in this from item; Kubernetes ANDs them.
        # Change the namespace value to the namespace where Prometheus runs.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
          # Change these labels to identify only the Prometheus scraper pods.
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9500
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-network-policy
  namespace: longhorn
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress (web UI)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Intra-namespace (manager <-> instance-manager <-> csi plugins <-> ui)
    - from:
        - podSelector: {}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # Kubernetes API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # Longhorn engines/replicas and NFS backups communicate directly between
    # nodes (iSCSI, gRPC, NFS) outside of normal service ports, so node/private
    # network access is left broadly open here rather than pinned to specific
    # ports to avoid risking storage availability.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
