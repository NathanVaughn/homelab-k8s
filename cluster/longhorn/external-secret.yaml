apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-env-external
  namespace: longhorn
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: longhorn-env
    template:
      mergePolicy: Merge
      data:
        VIRTUAL_HOSTED_STYLE: "false"
        BACKUP_TARGET: "s3://{{ .LONGHORN_S3_BUCKET }}@{{ .LONGHORN_S3_REGION }}/longhorn"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: LONGHORN_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: LONGHORN_S3_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        key: LONGHORN_S3_ENDPOINT
    - secretKey: LONGHORN_S3_BUCKET
      remoteRef:
        key: LONGHORN_S3_BUCKET
    - secretKey: LONGHORN_S3_REGION
      remoteRef:
        key: LONGHORN_S3_REGION
