apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mypypi-db-env-external
  namespace: mypypi
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mypypi-db-env
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: MYPYPI_DB_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: MYPYPI_DB_USERNAME
    - secretKey: POSTGRES_DB
      remoteRef:
        key: MYPYPI_DB_DATABASE
