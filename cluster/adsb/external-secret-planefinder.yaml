apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adsb-planefinder-env
  namespace: adsb
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: adsb-planefinder-env
  data:
    - secretKey: SHARECODE
      remoteRef:
        key: ADSB_PLANEFINDER_SHARECODE
    - secretKey: LAT
      remoteRef:
        key: ADSB_LAT
    - secretKey: LONG
      remoteRef:
        key: ADSB_LON
