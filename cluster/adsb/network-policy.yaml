apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adsb-network-policy
  namespace: adsb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
    # Prometheus scraping readsb/telegraf metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 9273
        - protocol: TCP
          port: 9274
    # Intra-namespace (feeder deployments <-> readsb data feed)
    - from:
        - podSelector: {}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace
    - to:
        - podSelector: {}
    # External (feeder uplinks to FlightAware, FlightRadar24, PlaneFinder)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
