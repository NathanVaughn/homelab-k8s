apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-dns-network-policy
  namespace: k8s-dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # To technitium-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: technitium-dns
      ports:
        - protocol: TCP
          port: 5380
    # Kubernetes API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
