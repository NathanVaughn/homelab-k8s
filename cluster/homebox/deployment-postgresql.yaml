apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homebox-postgresql-deployment
  namespace: homebox
spec:
  replicas: 1
  serviceName: homebox-postgresql
  selector:
    matchLabels:
      app: homebox-postgresql
  template:
    metadata:
      labels:
        app: homebox-postgresql
    spec:
      nodeSelector:
        role: apps
      containers:
        - envFrom:
            - secretRef:
                name: homebox-db-env
          # registry-proxy image-prefix
          image: cr.nathanv.app/docker.io/library/postgres:18.6
          name: postgresql
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/
              name: postgresql-vol
      volumes:
        - name: postgresql-vol
          persistentVolumeClaim:
            claimName: homebox-pvc-postgresql
