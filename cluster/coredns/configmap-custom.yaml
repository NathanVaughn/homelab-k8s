apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # This cluster has no IPv6 egress (pods only get a link-local IPv6 address,
  # no default route). Upstream DNS still returns AAAA records for many
  # external hosts (e.g. Backblaze B2 S3), and clients that don't correctly
  # fall back to IPv4 (e.g. longhorn-engine's S3 backup store driver) fail
  # with "connect: network is unreachable" instead of using the working A
  # record. Force all AAAA queries to return NODATA (NOERROR, empty answer)
  # cluster-wide so clients always get IPv4 addresses. Must be NOERROR, not
  # NXDOMAIN: NXDOMAIN claims the whole name doesn't exist (not just the AAAA
  # record), which breaks musl libc's getaddrinfo (used by Alpine-based
  # images, e.g. postgres:*-alpine) - it hard-fails the entire lookup instead
  # of falling back to the working A record. Picked up automatically via the
  # stock k3s CoreDNS Corefile's `import /etc/coredns/custom/*.override`
  # directive.
  no-ipv6.override: |
    template IN AAAA {
      rcode NOERROR
    }
