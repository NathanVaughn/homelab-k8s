apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lubelogger-postgresql-deployment
  namespace: lubelogger
spec:
  replicas: 1
  serviceName: lubelogger-postgresql
  selector:
    matchLabels:
      app: lubelogger-postgresql
  template:
    metadata:
      labels:
        app: lubelogger-postgresql
    spec:
      nodeSelector:
        role: apps
      securityContext:
        # Default containerd AppArmor profile breaks postgres signalling on kernel 7.0.0-42
        appArmorProfile:
          type: Unconfined
      containers:
        - envFrom:
            - secretRef:
                name: lubelogger-db-env
          # registry-proxy image-prefix
          image: cr.nathanv.app/docker.io/library/postgres:18.6
          name: postgresql
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/
              name: postgresql-vol
      volumes:
        - name: postgresql-vol
          persistentVolumeClaim:
            claimName: lubelogger-pvc-postgresql
